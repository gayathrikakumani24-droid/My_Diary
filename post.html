<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>post</title>
    <link rel="stylesheet" href="post.css">
</head>
<body>
    <a href="feed.html"><button id="btn1">&larr;</button></a>
    <div class="post">
       <form id="postForm">
        <label for="title">Post Title: </label><br>
        <input id="title" placeholder="Title Here" name="postTitle"><br>
        <label for="text">Describe your Day: </label><br>
        <textarea type="text" rows="15" cols="80" name="postDescription"></textarea><br>
        <button type="submit" id="postButton">Post My Day</button>
       </form>    
    </div>
<script>
    let form=document.getElementById('postForm');
    form.addEventListener('submit',async(e)=>{
        e.preventDefault();
        const formData=new URLSearchParams(new FormData(form));
        formData.append('userID',localStorage.getItem('userID'));
        const response =await fetch('http://localhost:3000/newPost',{
            method:'POST',
            headers:{
                'Content-Type':'application/x-www-form-urlencoded'
            },
            body:formData
        })
        if(response.status==200){
            alert("Post Successful");
            window.location.href="feed.html";
        }
        else{
            alert("Post Failed");
        }
    })  
    const btn1=document.getElementById('btn1');
    btn1.addEventListener('click',()=>{ 
        window.location.href="feed.html";
    })
</script>
</body>

</html>
