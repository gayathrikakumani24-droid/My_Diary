<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>post</title>
    <link rel="stylesheet" href="post.css">
</head>
<body>
    <a href="feed.html"><button id="btn1">&larr;</button></a>
    <div class="post">
       <form id="postForm">

    <label>Post Title:</label><br>
    <input id="title" name="postTitle"><br>

    <label>Describe your Day:</label><br>
    <textarea rows="15" cols="80"
    name="postDescription"></textarea>

    <div class="actions">
        <button type="submit" id="postButton">
            Post My Day
        </button>

        <button type="button" id="diaryFeelingBtn">
            💭 Ask My Diary
        </button>
    </div>

    <div id="diaryResponse"></div>

</form>   
    </div>
<script>
    let form=document.getElementById('postForm');
    form.addEventListener('submit',async(e)=>{
        e.preventDefault();
        const formData=new URLSearchParams(new FormData(form));
        formData.append('userID',localStorage.getItem('userID'));
        const response =await fetch('http://localhost:3000/newPost',{
            method:'POST',
            headers:{
                'Content-Type':'application/x-www-form-urlencoded'
            },
            body:formData
        })
        if(response.status==200){
            alert("Post Successful");
            window.location.href="feed.html";
        }
        else{
            alert("Post Failed");
        }
    })  
    const btn1=document.getElementById('btn1');
    btn1.addEventListener('click',()=>{ 
        window.location.href="feed.html";
    })
    const diaryBtn = document.getElementById("diaryFeelingBtn");

diaryBtn.addEventListener("click", async () => {

    const title = document.getElementById("title").value;

    const description =
        document.querySelector("textarea").value;
    const responseBox =document.getElementById("diaryResponse");
    responseBox.style.display="block";
   responseBox.innerHTML=`
<div class="diary-card">
    <p>📖 Reading your memories...</p>
</div>
`;
    const response = await fetch(
        "http://localhost:3000/diary-feelings",
        {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                title,
                description
            })
        }
    );

    const data = await response.json();

    

responseBox.style.display = "block";

responseBox.innerHTML = `
<div class="diary-card">
    <h3>📖 Your Diary Writes Back</h3>
    <p>${data.reply}</p>
</div>
`;
});
</script>
</body>

</html>
